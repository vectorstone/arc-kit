name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package
        run: tar czf "arc-kit-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" arc

      - uses: actions/upload-artifact@v4
        with:
          name: arc-kit-${{ matrix.target }}
          path: arc-kit-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: arc-kit-*
          merge-multiple: true

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" arc-kit-*.tar.gz \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_DARWIN_ARM="$(shasum -a 256 arc-kit-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)"
          SHA_DARWIN_X86="$(shasum -a 256 arc-kit-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)"
          SHA_LINUX_ARM="$(shasum -a 256 arc-kit-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)"
          SHA_LINUX_X86="$(shasum -a 256 arc-kit-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)"

          git fetch origin main
          git checkout -b formula-update origin/main

          if grep -q "version \"${VERSION}\"" Formula/arc-kit.rb 2>/dev/null; then
            echo "Formula already at version ${VERSION}, skipping"
            exit 0
          fi

          mkdir -p Formula
          cat > Formula/arc-kit.rb << FORMULA
          class ArcKit < Formula
            desc "CLI tool for managing coding agent providers, skills, and markets"
            homepage "https://github.com/duoyuli/arc-kit"
            license "MIT"
            version "${VERSION}"

            on_macos do
              on_arm do
                url "https://github.com/duoyuli/arc-kit/releases/download/v${VERSION}/arc-kit-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_DARWIN_ARM}"
              end

              on_intel do
                url "https://github.com/duoyuli/arc-kit/releases/download/v${VERSION}/arc-kit-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_DARWIN_X86}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/duoyuli/arc-kit/releases/download/v${VERSION}/arc-kit-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              end

              on_intel do
                url "https://github.com/duoyuli/arc-kit/releases/download/v${VERSION}/arc-kit-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_X86}"
              end
            end

            def install
              bin.install "arc"
            end

            test do
              system bin/"arc", "version"
            end
          end
          FORMULA

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/arc-kit.rb
          if ! git diff --cached --quiet; then
            git commit -m "formula: arc-kit ${VERSION}"
            git push origin formula-update:main
          fi
